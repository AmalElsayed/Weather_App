<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Weather API</title>
  </head>
  <body>
    <main class="container">
      <div class="searchBox">
        <input type="text" id="searchInput" placeholder="Search for a city" />
      </div>

      <!-- Weather Cards -->
      <div class="weatherContainer">
        <!-- Card 1 -->
        <div class="weatherCard">
          <div class="cardHeader">
            <span id="day1"></span>
            <span id="date1"></span>
          </div>
          <div class="cardBody">
            <h1 id="cityName1">
              <span></span>
          
            </h1>
            <p id="country1"></p>
            <h2 id="temperature1"></h2>
            <div class="weatherIcon" id="weatherIcon1"></div>
            <p id="weatherCondition1"></p>

            <!-- Weather details -->
            <div class="weatherDetails">
              <div>
            
                <span id="humidity1"></span>
              </div>
              <div>
                
                <span id="windSpeed1"></span>
              </div>
              <div>
              
                <span id="windDirection1"></span>
              </div>
            </div>
            <hr />

            <!-- Extra information -->
            <div class="extraDetails">
              <div>
                <span>Feels Like</span>
                <strong id="feelsLike1"></strong>
              </div>
              <div>
                <span>UV Index</span>
                <strong id="uvIndex1"></strong>
              </div>
              <div>
                <span>Visibility</span>
                <strong id="visibility1"></strong>
              </div>
            </div>
          </div>
          <div class="cardFooter">
            🕐 Last Updated:
            <span id="lastUpdated1"></span>
          </div>
        </div>

        <div class="weatherCard">
